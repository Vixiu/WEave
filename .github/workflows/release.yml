name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri App
        run: npm run tauri build

      - name: Prepare Artifacts & Zip Portable
        id: prepare_artifacts
        shell: powershell
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          $distDir = "dist_artifacts"
          New-Item -ItemType Directory -Force -Path $distDir

          # 1. Installer (.exe from NSIS)
          $nsisExe = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if ($nsisExe) {
              $exeTarget = "$distDir/WEave-v$ver-Setup-x64.exe"
              Copy-Item $nsisExe.FullName $exeTarget
              Write-Host "Created $exeTarget"
          }

          # 2. Installer (.msi)
          $msiFile = Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          if ($msiFile) {
              $msiTarget = "$distDir/WEave-v$ver-Setup-x64.msi"
              Copy-Item $msiFile.FullName $msiTarget
              Write-Host "Created $msiTarget"
          }

          # 3. Portable Zip (compress standalone executable)
          $exePath = "src-tauri/target/release/WEave.exe"
          if (Test-Path $exePath) {
              $zipTarget = "$distDir/WEave-v$ver-Portable-x64.zip"
              Compress-Archive -Path $exePath -DestinationPath $zipTarget -Force
              Write-Host "Created $zipTarget"
          }

      - name: Extract Release Notes from CHANGELOG.md
        id: extract_notes
        shell: powershell
        run: |
          $changelog = Get-Content CHANGELOG.md -Raw
          # Match notes from the first `## [` heading until the next `## [` heading or end of file
          if ($changelog -match "(?ms)^##\s+\[.*?\]\s*.*?\r?\n(.*?)(?=^##\s+\[|\z)") {
              $notes = $matches[1].Trim()
              Set-Content -Path "release_notes.md" -Value $notes -Encoding utf8
              Write-Host "Extracted release notes successfully."
          } else {
              Set-Content -Path "release_notes.md" -Value "Release ${{ github.ref_name }}" -Encoding utf8
              Write-Host "Fallback release notes used."
          }

      - name: Attest Build Artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist_artifacts/*'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: WEave ${{ github.ref_name }}
          body_path: release_notes.md
          files: dist_artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
